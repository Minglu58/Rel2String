      max_noise_loss_fraction: 0.25
      timestep_fraction: 0.1
      start_step: 10000
      warmup_steps: 10000
  validation_steps: 5000
  validation_max_batches: 1000000
  validation_sampling_steps: 20
  validation_sampling_max_batches: 8
  best_checkpoint_metric: null
  validation_data:
    data_path: datasets/SPD_canonical
    sequence_length: 64
    mode: val
    sr: 16000
    fps: 30
    n_mels: 80
    mel_hop_length: 256
    window_stride: 64
    include_last_window: true
    relation_key: relation_feature_zero_filled
    relation_mask_key: relation_feature_valid_mask
    pose_keys:
    - coco_wholebody_string_frame
    - bow_string_frame
    pose_grid_size:
    - 16
    - 16
    pose_fill_missing: ffill
    include_relation_mask_in_condition: true
    normalize_mel: true
    cache_audio: true
    fmin_note: C2
    fmax_note: E7
    num_workers: 4
    exclude_sample_ids:
    - violin_violin14
    - violin_violin24
    min_bow_valid_rate: 0.95
